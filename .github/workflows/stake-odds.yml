name: Stake Odds Scraper

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install puppeteer
      - name: Scrape
        run: node scraper.js
      - name: Commit
        run: |
          git config user.name bot
          git config user.email bot@overline.dev
          git add stake-odds.json || true
          git diff --cached --quiet || (git commit -m "odds update" && git push)
